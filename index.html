<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书间花园 · 每一次阅读都有回响</title><style>
:root{color:#263d32;background:#f6f4eb;font-family:Georgia,'Songti SC',serif}*{box-sizing:border-box}body{margin:0}header{padding:25px 6%;border-bottom:1px solid #daddcb;display:flex;justify-content:space-between;align-items:center}small,.eyebrow{font:12px system-ui;letter-spacing:3px;color:#79836d}main{max-width:1200px;margin:auto;padding:55px 6%}h1{font-size:clamp(36px,5vw,64px);font-weight:400;margin:15px 0}p{line-height:1.9;color:#737c69}button{cursor:pointer;border:1px solid #cbd1bd;background:transparent;color:#354b37;padding:12px 20px;border-radius:30px;font:14px system-ui}button:hover{background:#e3e9d6}button.primary{background:#324c37;color:white;border-color:#324c37}.intro{display:flex;justify-content:space-between;align-items:end;gap:30px}.stats{display:flex;gap:28px;margin:32px 0;font:13px system-ui;color:#78806e}.stats b{font:25px Georgia;color:#354b37;margin-right:8px}.garden{position:relative;min-height:360px;border-radius:180px 180px 25px 25px;background:radial-gradient(ellipse at 50% 5%,#e9efd9,#e2e8d3 65%,#d1d9bd);padding:65px 35px 25px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px;box-shadow:inset 0 -12px 0 #c9d2b2}.plant{border:0;border-radius:20px;width:150px;padding:0 5px 18px;animation:appear .8s both}.plant:hover{background:#ffffff45}.plant svg{width:130px;height:170px;overflow:visible}.plant strong{display:block;font-size:14px;margin-top:12px}.plant small{letter-spacing:0;font-size:11px}.sway{transform-origin:75px 145px;animation:sway 5s ease-in-out infinite}.grow{transform-origin:75px 145px;animation:grow 1s ease-out}.petal{animation:grow 1s both;transform-box:fill-box;transform-origin:center}.soil{fill:#b0ba96}.empty{padding:70px 0;text-align:center;color:#667b56}.foot{display:flex;justify-content:space-between;font:12px system-ui;color:#89917b;margin:20px 0}.steps{display:flex;gap:25px;border-top:1px solid #d9dfcd;margin-top:45px;padding-top:25px;flex-wrap:wrap}.steps span{flex:1;min-width:160px;color:#7c8471;font-size:13px}.steps b{display:block;color:#3a503a;font-size:16px;margin-bottom:8px}dialog{border:1px solid #d1d8c4;border-radius:22px;background:#faf9f2;padding:30px;width:440px;max-width:92vw;color:#304432}dialog::backdrop{background:#24342266;backdrop-filter:blur(5px)}input,textarea{display:block;width:100%;margin:10px 0 20px;padding:13px;border:1px solid #cbd2bd;background:#fffef8;border-radius:10px;font:15px system-ui;color:#304432}textarea{height:130px;resize:vertical}label{font-size:13px}.actions{display:flex;gap:10px;justify-content:end;flex-wrap:wrap}#notice{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#304c37;color:white;border-radius:30px;padding:14px 24px;display:none;z-index:10}h2{font-weight:400;font-size:28px}a{color:inherit}@keyframes grow{from{transform:scale(.05);opacity:0}to{transform:scale(1);opacity:1}}@keyframes appear{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}@keyframes sway{50%{transform:rotate(3deg)}}@media(max-width:600px){main{padding-top:30px}.intro{display:block}.intro button{margin-top:15px}.garden{padding:45px 10px 20px;border-radius:70px 70px 20px 20px}.plant{width:125px}.foot{display:block;line-height:2}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><header><div>❧ 书间花园</div><small>THE READING GARDEN</small></header><main><div class="intro"><div><div class="eyebrow">READ. REFLECT. BLOOM.</div><h1>读过的书，<br>会在这里开花。</h1><p>把阅读种进土里，让思考慢慢生长。<br>每一份共鸣，都会成为一朵花。</p></div><button class="primary" id="add">＋ 种下一本读完的书</button></div><div class="stats" id="stats"></div><section class="garden" id="garden" aria-label="我的阅读花园"></section><div class="foot"><span>点击植物，照料属于这本书的小小世界。</span><span>体验版 · 数据保存在当前浏览器</span></div><div class="steps"><span><b>01 / 阅读，是一颗种子</b>读完一本书，把它种进花园。</span><span><b>02 / 思考，让它发芽</b>写下一段书评，长出第一片叶子。</span><span><b>03 / 共鸣，让花盛开</b>每收到一个赞，就多开一朵花。</span></div><p style="font-size:12px;margin-top:35px">当前为个人体验版，点赞为模拟操作；真实读者互动将在多人版本中接入。支持下方导出备份。</p><button id="export">导出我的花园</button></main><dialog id="new"><form id="form"><h2>让一本书落地生根</h2><label>书名<input id="title" maxlength="60" placeholder="最近读完了哪本书？" required></label><label>作者（选填）<input id="author" maxlength="60" placeholder="这颗种子的赠予者"></label><div class="actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">种下种子</button></div></form></dialog><dialog id="detail"><h2 id="bookname"></h2><p id="stage"></p><label>我的书评<textarea id="review" maxlength="5000" placeholder="哪一句话、哪个瞬间，让你停了下来？"></textarea></label><div class="actions"><button id="close">收起</button><button id="save">保存书评</button><button class="primary" id="like">♡ 模拟一个赞</button></div><p style="font-size:12px" id="hint"></p></dialog><div id="notice" role="status"></div><script>
const $=id=>document.getElementById(id);let books=[];try{books=JSON.parse(localStorage.getItem('bookgarden-v1')||'[]');if(!Array.isArray(books))books=[]}catch{}let active;function persist(){try{localStorage.setItem('bookgarden-v1',JSON.stringify(books))}catch{tell('浏览器无法保存，请导出备份')}render()}function tell(s){$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',3200)}function plant(b){let s='<ellipse class="soil" cx="75" cy="148" rx="32" ry="7"/>';if(!b.review)return s+'<ellipse cx="75" cy="141" rx="9" ry="6" fill="#97744f" transform="rotate(-25 75 141)"/><path d="M71 143l8-5" stroke="#c5a87d"/>';s+='<g class="sway"><g class="grow"><path d="M75 145Q67 110 75 63" fill="none" stroke="#587b43" stroke-width="3"/><path d="M73 118Q38 119 42 94Q70 94 73 118M73 100Q103 104 110 79Q82 77 73 100" fill="#7e9e60"/>';for(let i=0;i<Math.min(b.likes,9);i++){let x=75+Math.sin(i*2.4)*34,y=60+Math.floor(i/3)*25;s+=`<path d="M75 140Q${x} 95 ${x} ${y}" stroke="#67884d" fill="none" stroke-width="2"/><g class="petal">`;for(let j=0;j<6;j++)s+=`<ellipse cx="${x}" cy="${y-9}" rx="6" ry="11" fill="${['#d9a2a0','#dfbe72','#b1a2cb'][i%3]}" transform="rotate(${j*60} ${x} ${y})"/>`;s+=`<circle cx="${x}" cy="${y}" r="5" fill="#f7e5a5"/></g>`}return s+'</g></g>'}function render(){$('stats').innerHTML=`<span><b>${books.length}</b>本书</span><span><b>${books.filter(b=>b.review).length}</b>株新芽</span><span><b>${books.reduce((a,b)=>a+b.likes,0)}</b>朵花</span>`;$('garden').replaceChildren();if(!books.length){let e=document.createElement('div');e.className='empty';e.innerHTML='✧<br><br>这片土地，正在等待你的第一本书。';$('garden').append(e)}books.forEach(b=>{let e=document.createElement('button');e.className='plant';e.innerHTML='<svg viewBox="0 0 150 170" aria-hidden="true">'+plant(b)+'</svg>';let t=document.createElement('strong');t.textContent=b.title;e.append(t);let sub=document.createElement('small');sub.textContent=b.likes?`${b.likes} 朵共鸣之花`:b.review?'新芽 · 等待共鸣':'种子 · 等待思考';e.append(sub);e.onclick=()=>open(b);$('garden').append(e)})}function open(b){active=b;$('bookname').textContent=b.title;$('review').value=b.review;$('stage').textContent=(b.author?b.author+' · ':'')+(b.review?(b.likes?'已经开出 '+b.likes+' 朵花':'写过的思考，已经发芽'):'一颗等待思考的种子');$('like').disabled=!b.review;$('hint').textContent='先保存书评，再体验点赞开花。每个模拟点赞计为一朵花，画面最多展示九朵。';$('detail').showModal()}$('add').onclick=()=>$('new').showModal();$('form').onsubmit=e=>{e.preventDefault();let title=$('title').value.trim();if(!title)return;books.push({id:Date.now().toString(36),title,author:$('author').value.trim(),review:'',likes:0,created:new Date().toISOString()});persist();$('new').close();$('form').reset();tell('书落进土里，变成了一颗种子。')};$('save').onclick=()=>{let r=$('review').value.trim();if(!r){tell('写下一点想法，再让它发芽吧');return}let fresh=!active.review;active.review=r;persist();$('detail').close();tell(fresh?'你的思考，让种子发芽了。':'书评已保存。')};$('like').onclick=()=>{if(!active.review)return;active.likes++;persist();$('detail').close();tell('收到一份共鸣，花园又开了一朵花。')};$('close').onclick=()=>$('detail').close();$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(books,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='书间花园.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></html>
